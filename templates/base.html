<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>HackTitan | Illinois Wesleyan University</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#acecdc",
                      "secondary-fixed-dim": "#93d3c3",
                      "on-tertiary-container": "#ffc3bd",
                      "tertiary": "#712c29",
                      "text-on-light": "#004e42",
                      "inverse-surface": "#2d312e",
                      "outline-variant": "#bec9c1",
                      "text-on-dark": "#FFFFFF",
                      "on-background": "#181d1a",
                      "surface-tint": "#0b6c4b",
                      "off-white": "#F5F2ED",
                      "on-secondary-fixed-variant": "#045044",
                      "surface-container-highest": "#e0e3df",
                      "on-primary-container": "#8fe2ba",
                      "surface": "#f7faf5",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#005137",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#84d7af",
                      "on-surface": "#181d1a",
                      "surface-variant": "#e0e3df",
                      "surface-container-high": "#e5e9e4",
                      "on-tertiary-fixed-variant": "#76312d",
                      "surface-bright": "#f7faf5",
                      "background": "#f7faf5",
                      "primary-container": "#006747",
                      "outline": "#6f7a72",
                      "tertiary-fixed": "#ffdad6",
                      "surface-container-low": "#f1f5f0",
                      "on-secondary-container": "#2d6d60",
                      "tertiary-container": "#8e433e",
                      "surface-container": "#ebefea",
                      "white": "#FFFFFF",
                      "secondary": "#28695c",
                      "primary-fixed-dim": "#84d7af",
                      "on-primary": "#ffffff",
                      "primary-fixed": "#a0f4ca",
                      "secondary-fixed": "#afefde",
                      "primary": "#004d34",
                      "on-error": "#ffffff",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed": "#00201a",
                      "inverse-on-surface": "#eef2ed",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed": "#3d0606",
                      "on-primary-fixed": "#002114",
                      "error": "#ba1a1a",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#ffb3ad",
                      "on-surface-variant": "#3f4943",
                      "surface-dim": "#d7dbd6",
                      "gold-accent": "#C9A84C"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "0.5rem",
                      "section-padding-mobile": "3rem",
                      "stack-md": "1rem",
                      "gutter": "1.5rem",
                      "stack-lg": "2rem",
                      "section-padding": "6rem",
                      "container-max": "1200px"
              },
              "fontFamily": {
                      "mono-label": ["Outfit"],
                      "body-md": ["Outfit"],
                      "headline-lg": ["Outfit"],
                      "body-lg": ["Outfit"],
                      "headline-md": ["Outfit"],
                      "headline-xl-mobile": ["Outfit"],
                      "headline-xl": ["Outfit"],
                      "quote": ["Outfit"]
              },
              "fontSize": {
                      "mono-label": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-lg": ["40px", {"lineHeight": "1.2", "fontWeight": "600"}],
                      "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "headline-xl-mobile": ["36px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "headline-xl": ["56px", {"lineHeight": "1.1", "fontWeight": "700"}],
                      "quote": ["32px", {"lineHeight": "1.4", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f7faf5;
            color: #181d1a;
            font-family: 'Outfit', sans-serif;
        }
        .hero-pattern {
            background-color: #f7faf5;
            background-image: radial-gradient(#C9A84C 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="font-body-md text-body-md">
    {% block content %}{% endblock %}
</body>
</html>
