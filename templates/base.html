<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>HackTitan | Illinois Wesleyan University</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#004d34",
                "primary-container": "#006747",
                secondary: "#28695c",
                "tertiary-container": "#8e433e",
                surface: "#f7faf5",
                "surface-container-low": "#f1f5f0",
                "surface-container-high": "#e5e9e4",
                "surface-container-lowest": "#ffffff",
                "on-surface": "#181d1a",
                "on-surface-variant": "#3f4943",
                "outline-variant": "#bec9c1",
                "off-white": "#F5F2ED",
                error: "#ba1a1a",
                "gold-accent": "#C9A84C",
              },
              borderRadius: {
                DEFAULT: "1rem",
                lg: "2rem",
                xl: "3rem",
                full: "9999px",
              },
              spacing: {
                "stack-sm": "0.5rem",
                "stack-md": "1rem",
                "stack-lg": "2rem",
                gutter: "1.5rem",
                "section-padding": "6rem",
                "section-padding-mobile": "3rem",
              },
              fontSize: {
                "mono-label": ["14px", { lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "500" }],
                "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                "body-lg": ["20px", { lineHeight: "1.6", fontWeight: "400" }],
                "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                "headline-lg": ["40px", { lineHeight: "1.2", fontWeight: "600" }],
                "headline-xl": ["56px", { lineHeight: "1.1", fontWeight: "700" }],
              },
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f7faf5;
            color: #181d1a;
            font-family: 'Outfit', sans-serif;
        }
        .hero-pattern {
            background-color: #f7faf5;
            background-image: radial-gradient(#C9A84C 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="font-body-md text-body-md">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="fixed top-24 right-6 z-[60] flex flex-col gap-3">
          {% for category, message in messages %}
            <div class="px-6 py-4 rounded-xl shadow-lg border backdrop-blur-md flex items-center gap-3 animate-in slide-in-from-right duration-300
              {% if category == 'success' %} bg-primary/90 text-white border-primary {% else %} bg-error/90 text-white border-error {% endif %}">
              <span class="material-symbols-outlined">
                {% if category == 'success' %} check_circle {% else %} error {% endif %}
              </span>
              <p class="font-bold">{{ message }}</p>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
