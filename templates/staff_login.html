{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-surface py-24 px-gutter flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="mb-8">
            <a href="/" class="inline-flex items-center text-primary hover:text-gold-accent transition-colors mb-6 group font-mono-label text-xs">
                <span class="material-symbols-outlined mr-1 text-lg group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
                Back to HackTitan
            </a>
            <h1 class="font-headline-xl text-headline-xl text-primary font-black mb-2">Staff sign in</h1>
            <p class="text-on-surface-variant text-sm">Sign in with your staff email and password.</p>
        </div>

        <form action="{{ url_for('staff_login') }}" method="POST" class="bg-white rounded-2xl border border-outline-variant/40 shadow-sm p-6 space-y-5">
            <input type="hidden" name="next" value="{{ request.form.get('next') or request.args.get('next', '') }}">

            <div class="flex flex-col gap-2">
                <label for="email" class="font-bold text-primary text-sm">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username"
                    value="{{ email_prefill }}"
                    class="bg-surface border border-outline-variant rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="font-bold text-primary text-sm">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 pr-11 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <button type="button" tabindex="-1" onclick="togglePassword('password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-primary-container text-white py-3.5 rounded-full font-mono-label font-bold hover:bg-primary transition-colors mt-2">
                Sign in
            </button>
        </form>

        <p class="text-center text-sm text-on-surface-variant mt-6">
            New organizer?
            <a href="{{ url_for('staff_signup') }}" class="text-primary font-bold underline hover:text-gold-accent">Staff sign up</a>
        </p>
    </div>
</div>

<script>
function togglePassword(fieldId, btn) {
    var input = document.getElementById(fieldId)
    var icon = btn.querySelector('.material-symbols-outlined')
    if (input.type === 'password') {
        input.type = 'text'
        icon.textContent = 'visibility_off'
    } else {
        input.type = 'password'
        icon.textContent = 'visibility'
    }
}
</script>
{% endblock %}
